{% extends "admin/base.html" %}
{% block content %}
<h1 class="h3 mb-3">Categories</h1>
<p class="text-muted">The category image is shown on the home and Products pages.</p>
{% for c in categories %}
<form method="post" enctype="multipart/form-data" action="{{ url_for('admin.edit_category', cid=c.id) }}"
      class="card card-body mb-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3 align-items-center">
    <div class="col-auto">
      {% if c.image_filename %}<img class="thumb" src="{{ url_for('main.uploads', filename=c.image_filename) }}" alt="">
      {% else %}<div class="thumb bg-light border d-flex align-items-center justify-content-center small">No image</div>{% endif %}
    </div>
    <div class="col-md-4"><input class="form-control" name="name" value="{{ c.name }}" required aria-label="Category name"></div>
    <div class="col-md-3"><input class="form-control" type="file" name="image" accept=".jpg,.jpeg,.png,.webp" aria-label="Category image"></div>
    <div class="col-auto form-check ms-2">
      <input class="form-check-input" type="checkbox" name="is_active" id="a{{ c.id }}" {{ 'checked' if c.is_active }}>
      <label class="form-check-label" for="a{{ c.id }}">Active</label>
    </div>
    <div class="col-auto"><button class="btn btn-burgundy btn-sm">Save</button></div>
  </div>
</form>
{% endfor %}
{% endblock %}
