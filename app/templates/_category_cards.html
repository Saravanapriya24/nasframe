<div class="row g-4 justify-content-center">
  {% for c in categories %}
  <div class="col-6 col-md-4 col-lg-3">
    <a class="cat-card" href="{{ url_for('main.category', slug=c.slug) }}">
      {% if c.image_filename %}
        <img src="{{ url_for('main.uploads', filename=c.image_filename) }}" alt="{{ c.name }}" loading="lazy">
      {% else %}
        <div class="img-placeholder">{{ c.name }}</div>
      {% endif %}
      <span class="cat-name">{{ c.name }}</span>
    </a>
  </div>
  {% endfor %}
</div>
