<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.business_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between">
      <a href="{{ url_for('main.index') }}" class="brand d-flex align-items-center gap-2">
        {% if site.logo_filename %}
          <img src="{{ url_for('main.uploads', filename=site.logo_filename) }}" alt="{{ site.business_name }} logo" class="brand-logo">
        {% endif %}
        <span class="brand-name">{{ site.business_name }}</span>
      </a>
            <button class="nav-toggle" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
        <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="nav-toggle-label">Menu</span>
      </button>
    </div>
    <nav class="navbar navbar-expand-md p-0">
      <div class="collapse navbar-collapse justify-content-center" id="mainNav">
        <ul class="navbar-nav main-nav">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.products') }}">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.about') }}">About</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="site-footer text-center">
  <div class="container">
    <h2 class="h5">Contact Us</h2>
    <p class="mb-1">Phone: <a href="{{ tel_link() }}">{{ site.phone }}</a></p>
    <p class="mb-1">WhatsApp: <a href="{{ wa_link() }}" target="_blank" rel="noopener">{{ site.whatsapp }}</a></p>
    <p class="mb-0">For product details, orders and enquiries.</p>
  </div>
</footer>

<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="imageModalTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img id="imageModalImg" src="" alt="" class="img-fluid">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
