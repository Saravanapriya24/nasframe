<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | NAS Frame Works</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#FFF8EB; color:#4A3025; }
    .admin-nav { background:#510D16; }
    .admin-nav .nav-link, .admin-nav .navbar-brand { color:#F5D778; }
    .btn-burgundy { background:#510D16; color:#fff; border:0; }
    .btn-burgundy:hover { background:#3b0a10; color:#fff; }
    .thumb { width:64px; height:64px; object-fit:cover; border-radius:6px; }
  </style>
</head>
<body>
{% if current_user.is_authenticated %}
<nav class="navbar navbar-expand-md navbar-dark admin-nav">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">NAS Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#an" aria-label="Menu">
      <span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="an">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.products') }}">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.categories') }}">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.sizes') }}">Sizes</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.settings') }}">Website Content</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}" target="_blank">View Site</a></li>
      </ul>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm btn-outline-light">Logout</button>
      </form>
    </div>
  </div>
</nav>
{% endif %}
<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
