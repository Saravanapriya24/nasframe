{% extends "base.html" %}
{% block title %}Our Products | {{ site.business_name }}{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <h1 class="section-title text-center mb-4">Our Products</h1>
    {% include "_category_cards.html" %}
  </div>
</section>

<section class="py-5 bg-white">
  <div class="container text-center">
    <h2 class="section-title mb-4">Available Sizes</h2>
    <div class="d-flex flex-wrap justify-content-center gap-3">
      {% for s in sizes %}
        <a class="size-pill" href="{{ url_for('main.size_gallery', size_id=s.id) }}">{{ s.label }}</a>
      {% else %}
        <p>Sizes will be listed soon.</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
